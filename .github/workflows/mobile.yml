name: Builds (Windows installer + Android APK + unsigned iOS IPA)
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['app/**', 'mobile/**', 'capacitor.config.json', 'package.json', 'main.js', '.github/workflows/mobile.yml']
permissions:
  contents: write
env:
  CAP: '6.2.0'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: dist/IBRA-World-Tour-Setup.exe }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create the Android project
        run: |
          rm -f package.json package-lock.json
          npm init -y >/dev/null
          npm install @capacitor/core@$CAP @capacitor/cli@$CAP @capacitor/android@$CAP
          npx cap add android
          cp mobile/MainActivity.java android/app/src/main/java/com/ibraprogram/worldtour/MainActivity.java
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          cp -R mobile/icons/mipmap-* android/app/src/main/res/
          sed -i 's/#FFFFFF/#14110A/' android/app/src/main/res/values/ic_launcher_background.xml || true
          npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk IBRA-World-Tour.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: IBRA-World-Tour.apk }
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Create the iOS project
        run: |
          rm -f package.json package-lock.json
          npm init -y >/dev/null
          npm install @capacitor/core@$CAP @capacitor/cli@$CAP @capacitor/ios@$CAP
          npx cap add ios
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeLeft" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeRight" $P
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeLeft" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeRight" $P
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" $P || /usr/libexec/PlistBuddy -c "Set :UIStatusBarHidden true" $P
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" $P || /usr/libexec/PlistBuddy -c "Set :UIViewControllerBasedStatusBarAppearance false" $P
          cp mobile/icons/ios-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          npx cap sync ios
      - name: Build without signing
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
      - name: Package unsigned IPA
        run: |
          mkdir Payload && cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry IBRA-World-Tour-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios-unsigned-ipa, path: IBRA-World-Tour-unsigned.ipa }
  release:
    needs: [windows, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: IBRA World Tour
          body: Windows installer, Android APK and unsigned iPhone IPA.
          files: |
            IBRA-World-Tour-Setup.exe
            IBRA-World-Tour.apk
            IBRA-World-Tour-unsigned.ipa
